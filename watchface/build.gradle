apply plugin: 'com.android.application'

def props = new Properties()
File keystoreProperties = rootProject.file("keystore.properties")
if (keystoreProperties.exists()) {
    props.load(new FileInputStream(keystoreProperties))
} else {
    props['keystorefile'] = 'none';
}

android {
    compileSdk rootProject.ext.compileSdkVersion

    defaultConfig {
        applicationId "dev.dworks.apps.awatch"
        minSdkVersion rootProject.ext.minSdkVersion
        targetSdkVersion rootProject.ext.targetSdkWatchVersion
        versionCode rootProject.generateVersionCode(2)
        versionName rootProject.generateVersionName()
        multiDexEnabled true
    }
    signingConfigs {
        release
    }
    buildTypes {
        release {
            signingConfig signingConfigs.release
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.pro'
        }
    }

    flavorDimensions "release", "default"
    productFlavors {
        free {
            dimension "default"
        }
        pro {
            dimension "default"
        }
        wear {
            dimension "release"
        }
    }
    namespace 'dev.dworks.apps.awatch'
}

dependencies {
    implementation 'androidx.wear:wear:1.3.0'
    implementation 'com.google.android.support:wearable:2.9.0'
    implementation 'com.google.firebase:firebase-core:21.1.1'
    implementation 'com.google.firebase:firebase-crashlytics:19.0.3'
    compileOnly 'com.google.android.wearable:wearable:2.9.0'
    implementation project(':common')
}

android.signingConfigs.release.storeFile rootProject.file(props.keyStore)
android.signingConfigs.release.storePassword props.keyStorePassword
android.signingConfigs.release.keyAlias props.keyAlias
android.signingConfigs.release.keyPassword props.keyAliasPassword

apply plugin: 'com.google.gms.google-services'
apply plugin: 'com.google.firebase.crashlytics'
